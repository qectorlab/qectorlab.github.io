# Dependency updates for the site, the two Workers' tooling and the workflows.
# Security updates also need "Dependabot alerts" switched on in the repository
# settings (Settings → Advanced Security).
version: 2
updates:
  - package-ecosystem: npm
    directory: /source
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
